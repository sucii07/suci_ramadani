<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Suci Ramadani</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="halaman-login">

<nav class="navbar navbar-dark nav-ungu">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Suci Ramadani</a>
        <a href="index.html" class="nav-link text-white">← Kembali ke Beranda</a>
    </div>
</nav>

<main class="login-wrapper">
    <div class="login-box">
        <div class="ikon mx-auto mb-3">🔐</div>

        <h1 class="h2 fw-bold text-center">Selamat Datang</h1>
        <p class="teks-redup text-center">
            Silakan isi formulir login untuk mencoba validasi.
        </p>

        <form id="loginForm" novalidate>
            <div class="mb-3">
                <label for="username" class="form-label">Username atau Email</label>
                <input type="text" class="form-control" id="username"
                       placeholder="Masukkan username" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Kata Sandi</label>
                <input type="password" class="form-control" id="password"
                       placeholder="Minimal 6 karakter" required>
            </div>

            <button type="submit" class="btn btn-ungu w-100 mt-2">
                Login
            </button>

            <div id="loginMessage" class="mt-3" role="status"></div>
        </form>

        <p class="small teks-redup mt-4 mb-0">
            Catatan: halaman ini hanya untuk demonstrasi validasi formulir.
        </p>
    </div>
</main>

<footer class="footer">
    <p>© 2026 Suci Ramadani | Portofolio Pribadi</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
